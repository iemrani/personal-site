<svg viewBox="0 0 1000 430" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="inner-speech-title inner-speech-desc">
  <title id="inner-speech-title">Why mime before thinking</title>
  <desc id="inner-speech-desc">Inner speech sits inside attempted speech in motor cortex: the same neural pattern at lower amplitude, not a different one. Because of that containment, a decoder trained on strong, clearly labelled mimed speech already covers most of what it needs for faint imagined speech, which is why the training curriculum runs mime first and think second.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6b6a63"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2323e6"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#faf9f7"/>
  <g transform="translate(0,-62)">
  <rect x="56" y="96" width="488" height="296" fill="rgba(20,20,15,0.015)" stroke="rgba(20,20,15,0.30)" stroke-width="0.8"/>
  <rect x="68" y="90" width="146" height="12" fill="#faf9f7"/>
  <text class="fig-stamp" x="72" y="99" fill="rgba(20,20,15,0.40)" text-anchor="start" letter-spacing="0.14em">SPEECH MOTOR CORTEX</text>
  <rect x="88" y="132" width="424" height="224" fill="rgba(20,20,15,0.025)" stroke="#6b6a63" stroke-width="1"/>
  <rect x="100" y="126" width="172" height="12" fill="#faf9f7"/>
  <text class="fig-stamp" x="104" y="135" fill="#6b6a63" text-anchor="start" letter-spacing="0.14em">ATTEMPTED SPEECH, MIMED</text>
  <text class="fig-title" x="104" y="160" fill="#14140f" text-anchor="start">Strong signal</text>
  <text class="fig-label" x="104" y="176" fill="#6b6a63" text-anchor="start">he is visibly trying, so the labels are certain</text>
  <rect x="120" y="204" width="360" height="124" fill="rgba(35,35,230,0.08)" stroke="#2323e6" stroke-width="1.2"/>
  <rect x="132" y="198" width="94" height="12" fill="#faf9f7"/>
  <text class="fig-stamp" x="136" y="207" fill="#2323e6" text-anchor="start" letter-spacing="0.14em">INNER SPEECH</text>
  <text class="fig-title" x="136" y="240" fill="#14140f" text-anchor="start">The same pattern, quieter</text>
  <text class="fig-label" x="136" y="260" fill="#6b6a63" text-anchor="start">not a different signal in a different place:</text>
  <text class="fig-label" x="136" y="274" fill="#6b6a63" text-anchor="start">a scaled-down version of the one above</text>
  <text class="fig-label" x="136" y="302" fill="#2323e6" text-anchor="start">which is why training transfers inward</text>
  <text class="fig-h1" x="56" y="424" fill="#14140f" font-style="italic" text-anchor="start">Train where the signal is strong. Use it where the signal is useful.</text>
  <rect x="600" y="90" width="108" height="12" fill="#faf9f7"/>
  <text class="fig-stamp" x="604" y="99" fill="rgba(20,20,15,0.40)" text-anchor="start" letter-spacing="0.14em">THE CURRICULUM</text>
  <path d="M 776,208 V 248" fill="none" stroke="#2323e6" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <rect x="790" y="214" width="120" height="14" fill="#faf9f7"/>
  <text class="fig-meta" x="792" y="224" fill="#2323e6" text-anchor="start" letter-spacing="0.06em">SAME DECODER</text>
  <rect x="592" y="136" width="368" height="72" fill="#faf9f7"/>
  <rect x="592" y="136" width="368" height="72" fill="#ffffff" stroke="#14140f" stroke-width="1"/>
  <rect x="600" y="142" width="24" height="12" fill="transparent" stroke="rgba(20,20,15,0.40)" stroke-width="0.8"/>
  <text class="fig-stamp" x="612" y="151" fill="rgba(20,20,15,0.80)" text-anchor="middle" letter-spacing="0.08em">1</text>
  <text class="fig-title" x="620" y="176" fill="#14140f" text-anchor="start">Mime the words</text>
  <text class="fig-meta" x="620" y="194" fill="#6b6a63" text-anchor="start">loud signal, unambiguous labels, hard work for him</text>
  <rect x="592" y="248" width="368" height="72" fill="#faf9f7"/>
  <rect x="592" y="248" width="368" height="72" fill="rgba(35,35,230,0.08)" stroke="#2323e6" stroke-width="1.2"/>
  <rect x="600" y="254" width="24" height="12" fill="transparent" stroke="rgba(35,35,230,0.50)" stroke-width="0.8"/>
  <text class="fig-stamp" x="612" y="263" fill="#2323e6" text-anchor="middle" letter-spacing="0.08em">2</text>
  <text class="fig-title" x="620" y="288" fill="#14140f" text-anchor="start">Only think the words</text>
  <text class="fig-meta" x="620" y="306" fill="#6b6a63" text-anchor="start">faint signal, no effort, and the goal all along</text>
  <line x1="30" y1="456" x2="970" y2="456" stroke="rgba(20,20,15,0.10)" stroke-width="0.8"/>
  <text class="fig-meta" x="30" y="472" fill="#6b6a63" letter-spacing="0.14em">LEGEND</text>
  <rect x="128" y="464" width="10" height="10" fill="rgba(35,35,230,0.08)" stroke="#2323e6" stroke-width="1.2"/>
  <text class="fig-meta" x="146" y="473" fill="#6b6a63">imagined speech: the target, and the quieter case</text>
  <rect x="532" y="464" width="10" height="10" fill="rgba(20,20,15,0.025)" stroke="#6b6a63" stroke-width="1"/>
  <text class="fig-meta" x="550" y="473" fill="#6b6a63">mimed speech: where the training data comes from</text>
  </g>
</svg>
