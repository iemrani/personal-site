<svg viewBox="0 0 1000 510" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="accuracy-title accuracy-desc">
  <title id="accuracy-title">The cost of only thinking</title>
  <desc id="accuracy-desc">Word accuracy for four speech-decoding conditions. Attempted speech reaches 99.6 percent on a 50-word vocabulary on day one, 90.2 percent on a 125,000-word vocabulary on day two, and settles at 97.5 percent. Imagined speech on the same large vocabulary reaches 74 percent, so decoding thought rather than attempted speech costs real accuracy.</desc>
  <rect width="100%" height="100%" fill="#faf9f7"/>
  <g transform="translate(0,-6)">
  <line x1="80" y1="40"  x2="960" y2="40"  stroke="rgba(20,20,15,0.08)" stroke-width="0.8"/>
  <line x1="80" y1="116" x2="960" y2="116" stroke="rgba(20,20,15,0.08)" stroke-width="0.8"/>
  <line x1="80" y1="192" x2="960" y2="192" stroke="rgba(20,20,15,0.08)" stroke-width="0.8"/>
  <line x1="80" y1="268" x2="960" y2="268" stroke="rgba(20,20,15,0.08)" stroke-width="0.8"/>
  <line x1="80" y1="344" x2="960" y2="344" stroke="rgba(20,20,15,0.08)" stroke-width="0.8"/>
  <text class="fig-meta" x="72" y="43"  fill="#6b6a63" text-anchor="end">100%</text>
  <text class="fig-meta" x="72" y="119" fill="#6b6a63" text-anchor="end">80%</text>
  <text class="fig-meta" x="72" y="195" fill="#6b6a63" text-anchor="end">60%</text>
  <text class="fig-meta" x="72" y="271" fill="#6b6a63" text-anchor="end">40%</text>
  <text class="fig-meta" x="72" y="347" fill="#6b6a63" text-anchor="end">20%</text>
  <text class="fig-meta" x="72" y="423" fill="#6b6a63" text-anchor="end">0%</text>
  <text class="fig-stamp" transform="rotate(-90 24 230)" x="24" y="230" fill="#6b6a63" text-anchor="middle" letter-spacing="0.14em">WORD ACCURACY</text>
  <line x1="80" y1="40" x2="80" y2="420" stroke="rgba(20,20,15,0.25)" stroke-width="1"/>
  <line x1="80" y1="420" x2="960" y2="420" stroke="rgba(20,20,15,0.25)" stroke-width="1"/>
  <rect x="120" y="42" width="140" height="378" fill="#faf9f7"/>
  <rect x="120" y="42" width="140" height="378" fill="rgba(107,106,99,0.15)" stroke="#6b6a63" stroke-width="1"/>
  <text class="fig-meta" x="190" y="34" fill="#6b6a63" text-anchor="middle">99.6%</text>
  <rect x="340" y="77" width="140" height="343" fill="#faf9f7"/>
  <rect x="340" y="77" width="140" height="343" fill="rgba(107,106,99,0.15)" stroke="#6b6a63" stroke-width="1"/>
  <text class="fig-meta" x="410" y="69" fill="#6b6a63" text-anchor="middle">90.2%</text>
  <rect x="560" y="50" width="140" height="370" fill="#faf9f7"/>
  <rect x="560" y="50" width="140" height="370" fill="rgba(107,106,99,0.15)" stroke="#6b6a63" stroke-width="1"/>
  <text class="fig-meta" x="630" y="42" fill="#6b6a63" text-anchor="middle">97.5%</text>
  <rect x="780" y="139" width="140" height="281" fill="#faf9f7"/>
  <rect x="780" y="139" width="140" height="281" fill="rgba(35,35,230,0.12)" stroke="#2323e6" stroke-width="1"/>
  <text class="fig-meta" x="850" y="131" fill="#2323e6" text-anchor="middle">74%</text>
  <text class="fig-title-tight" x="190" y="442" fill="#14140f" text-anchor="middle">Attempted, day 1</text>
  <text class="fig-meta" x="190" y="456" fill="#85847c" text-anchor="middle">50-word vocabulary</text>
  <text class="fig-title-tight" x="410" y="442" fill="#14140f" text-anchor="middle">Attempted, day 2</text>
  <text class="fig-meta" x="410" y="456" fill="#85847c" text-anchor="middle">125,000-word vocabulary</text>
  <text class="fig-title-tight" x="630" y="442" fill="#14140f" text-anchor="middle">Attempted, settled</text>
  <text class="fig-meta" x="630" y="456" fill="#85847c" text-anchor="middle">125,000-word vocabulary</text>
  <text class="fig-title-tight" x="850" y="442" fill="#2323e6" text-anchor="middle">Imagined only</text>
  <text class="fig-meta" x="850" y="456" fill="#85847c" text-anchor="middle">125,000-word vocabulary</text>
  <line x1="30" y1="480" x2="970" y2="480" stroke="rgba(20,20,15,0.10)" stroke-width="0.8"/>
  <text class="fig-meta" x="30" y="496" fill="#6b6a63" letter-spacing="0.14em">LEGEND</text>
  <rect x="128" y="488" width="10" height="10" fill="rgba(107,106,99,0.15)" stroke="#6b6a63" stroke-width="1"/>
  <text class="fig-meta" x="146" y="497" fill="#6b6a63">he is trying to speak</text>
  <rect x="332" y="488" width="10" height="10" fill="rgba(35,35,230,0.12)" stroke="#2323e6" stroke-width="1"/>
  <text class="fig-meta" x="350" y="497" fill="#6b6a63">he is only imagining it</text>
  </g>
</svg>
